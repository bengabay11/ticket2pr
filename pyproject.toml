[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticket2pr"
dynamic = ["version"]
description = "Automate Jira ticket to GitHub PR workflow"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ben Gabay", email = "ben.gabay38@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "claude-agent-sdk>=0.1.25",
    "colorlog>=6.9.0",
    "fastapi>=0.134.0",
    "gitpython>=3.1.46",
    "jira>=3.10.5",
    "pydantic>=2.11.5",
    "pydantic-settings[toml]>=2.9.1",
    "pygithub>=2.8.1",
    "python-dotenv>=1.1.0",
    "rich>=14.0.0",
    "tomli-w>=1.2.0",
    "typer>=0.21.1",
    "typing_extensions>=4.0.0",
    "uvicorn>=0.40.0",
]

[project.urls]
Homepage = "https://github.com/bengabay11/ticket2pr"
Repository = "https://github.com/bengabay11/ticket2pr"

[project.scripts]
ticket2pr = "src.cli:cli_main"

[tool.hatch.version]
path = "ticket2pr/__init__.py"

[dependency-groups]
dev = [
    "absolufy-imports>=0.3.1",
    "bandit>=1.8.3",
    "codespell>=2.4.1",
    "mypy>=1.16.0",
    "pre-commit>=4.2.0",
    "pydantic[mypy]>=2.11.5",
    "pytest>=8.3.5",
    "pytest-cases>=3.8.6",
    "ruff>=0.11.12",
]
