[core]
workspace_path = "."
base_branch = "main"
mcp_config_path = "/path/to/mcp.json"
allowed_mcp_tools = [
    "mcp__my-server__*",           # all tools from "my-server"
    "mcp__db__run_query",          # single tool from "db" server
    "mcp__github__search_issues",  # single tool from "github" server
]

[jira]
base_url = "https://<your_company>.atlassian.net"
username = "<username>@gmail.com"
api_token = "<jira_token>"

[github]
username = "<username>"
api_token = "github_token"
repo_full_name = "owner/repo"
